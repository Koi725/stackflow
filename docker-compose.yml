# Stackflow production stack: the Next.js app + its own PostgreSQL.
#
# Secrets/config come from a root .env (gitignored) — see .env.example.
# The app port is bound to 127.0.0.1 ONLY; nginx on the host fronts it and is the
# only thing that should be publicly exposed. Never publish the app or db directly.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # Conservative caps so a runaway query/leak here can't starve the shared host
    # (which also runs darsman production). Tune up only if Postgres needs it.
    mem_limit: 512m
    cpus: "0.50"
    pids_limit: 256
    # Bound container log growth so stdout/stderr can't fill the host disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Not published — only reachable by the app service on the internal network.
    # db stays on the private stackflow network ONLY: never on the darsman
    # network, never exposed to the host.
    #
    # A UNIQUE alias `stackflow-db` is published on the internal network. The app
    # connects via this alias (DATABASE_URL=@stackflow-db:5432), NOT the bare
    # service name `db`: because the app also joins the shared darsman network,
    # the generic name `db` could resolve to darsman's own Postgres (darsman-db-1)
    # and cause migrations to hit the WRONG database (P1000). `stackflow-db` exists
    # only on the internal network, so it can never collide.
    networks:
      internal:
        aliases:
          - stackflow-db

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Conservative caps so an app-side spike (e.g. bcrypt/CPU or a memory leak)
    # can't exhaust the shared host and take down the co-located darsman prod app.
    mem_limit: 512m
    cpus: "0.50"
    pids_limit: 256
    # Bound container log growth so stdout/stderr can't fill the host disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    # All app secrets/config (SESSION_SECRET, DATABASE_URL, AUTH_MODE, seed
    # passwords, etc.) come from the root .env.
    env_file:
      - .env
    environment:
      # Persisted avatar dir — MUST match the mounted volume below so uploads
      # survive rebuilds/redeploys. Defaults here in case it's omitted from .env.
      AVATAR_UPLOAD_DIR: ${AVATAR_UPLOAD_DIR:-/app/var/avatars}
    volumes:
      # Uploaded avatars live on a named volume, NOT in the image — they persist
      # across `docker compose build --no-cache` and redeploys.
      - avatars:/app/var/avatars
    ports:
      # Bound to loopback only. nginx (host) proxies to 127.0.0.1:3400.
      - "127.0.0.1:3400:3000"
    networks:
      # `internal` = private app<->db link (below). `darsman-auth` = a DEDICATED,
      # minimal-blast-radius network shared with ONLY darsman-backend-1, joined so
      # the app can reach the backend by container name for auth (DARSMAN_AUTH_URL):
      #   http://darsman-backend-1:8000/api/auth/login
      #
      # We deliberately do NOT join darsman's full `darsman_default` network: on a
      # bridge network every container can reach every other on all ports, which
      # would give stackflow direct reach to darsman-db-1:5432 and every other
      # darsman container. Scoping to a two-member network means the only thing
      # stackflow can reach on the darsman side is the backend's auth port.
      - internal
      - darsman-auth

volumes:
  pgdata: # PostgreSQL data — persists across deploys
  avatars: # uploaded user avatars — persists across deploys

networks:
  # Private network for app<->db only. Not attached to db's host, never exposed.
  internal:
    driver: bridge

  # Dedicated auth-only network shared with darsman-backend-1 ONLY. Referenced as
  # EXTERNAL (Compose will NOT create it) and owned by NEITHER compose project, so
  # it survives a redeploy (`docker compose down`/`up`) of stackflow OR darsman.
  #
  # Create it ONCE, out-of-band, on the server:
  #   docker network create darsman-auth
  # Then attach darsman-backend-1 to it (see darsman's compose change on deploy).
  #
  # Blast-radius rationale: this replaces stackflow's former membership in
  # darsman's full `darsman_default` network. Only stackflow-app and
  # darsman-backend-1 join `darsman-auth`, so stackflow can reach the backend's
  # auth port but has NO route to darsman-db-1:5432 or any other darsman service.
  # If the network is absent, `app` fails to start (fail-safe) rather than falling
  # back to a broader network.
  darsman-auth:
    external: true
    name: darsman-auth
